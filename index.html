<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIM Expense Report</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" alt="Safety In Motion" hidden>
      <span class="brand-name">Expense Report</span>
    </div>
    <button id="settingsBtn" class="btn ghost" type="button">Settings</button>
  </header>

  <div class="layout">
    <nav id="stepper" class="stepper" aria-label="Steps"></nav>
    <main id="main" class="main"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/vendor/tesseract/tesseract.min.js"></script>
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/extract.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
